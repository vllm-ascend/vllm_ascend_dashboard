# Production Docker Compose Configuration for vLLM Ascend Dashboard
# Features:
# - External volumes for persistent data
# - External configuration files
# - MySQL database for production
# - Health checks and auto-restart
# - Network isolation
# - Resource limits

# Keep the transition compatible with the existing production containers. The
# project name and volume names are explicit so a checkout path change cannot
# silently create a second, empty MySQL volume.
name: ${DASHBOARD_COMPOSE_PROJECT:-vllm_ascend_dashboard}

services:
  # ── LiteLLM API Gateway（Anthropic ↔ OpenAI 格式翻译）──
  litellm:
    image: ${DASHBOARD_LITELLM_IMAGE:?set DASHBOARD_LITELLM_IMAGE to an immutable image digest}
    init: true
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master-key-change-me}
      - STORE_MODEL_IN_DB=false
    entrypoint: []
    command: ["litellm", "--config", "/app/litellm_config.yaml", "--port", "4000"]
    volumes:
      # Backend writes the same runtime file after provider changes.
      - ${DASHBOARD_LITELLM_CONFIG_FILE:-../../config-templates/litellm_config.yaml}:/app/litellm_config.yaml
    expose:
      - "4000"
    networks:
      - dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',4000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # Backend API Service
  backend:
    image: ${DASHBOARD_BACKEND_IMAGE:?set DASHBOARD_BACKEND_IMAGE to a CI-published immutable image}
    init: true
    env_file:
      - ${DASHBOARD_RUNTIME_ENV_FILE:-../../../.env.production}
    environment:
      # Database connection (MySQL)
      - DATABASE_URL=mysql+aiomysql://${CONTROL_DB_USER:-control_svc}:${CONTROL_DB_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vllm_dashboard}
      # API handles UI fan-out. This budget assumes one API process; each
      # additional process/replica adds another independent pool.
      - DB_POOL_SIZE=${API_DB_POOL_SIZE:-30}
      - DB_MAX_OVERFLOW=${API_DB_MAX_OVERFLOW:-30}
      - DB_POOL_TIMEOUT=${API_DB_POOL_TIMEOUT:-30}
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      # LiteLLM gateway
      - LITELLM_PROXY_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master-key-change-me}
      # Agent must only use the container-network LiteLLM gateway.
      - AGENT_SERVICE_ENABLED=false
      - AGENT_PROXY_ONLY=true
      - AGENT_PROXY_ALLOWED_HOSTS=litellm
      # Runtime overrides
      - ENVIRONMENT=production
      - DEBUG=false
      # Production schema changes are executed by operations/production/migrate.sh.
      - AUTO_MIGRATE=false
    volumes:
      # Persistent data directory - survives container restarts
      # This includes /app/data/repos for git cache
      - backend_data:/app/data
      # LiteLLM runtime config shared with the gateway container
      - ${DASHBOARD_LITELLM_CONFIG_FILE:-../../config-templates/litellm_config.yaml}:/app/litellm_config.yaml
      # Log files
      - backend_logs:/app/logs
    # Do NOT expose backend port to public - only accessible via nginx proxy
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000"
    networks:
      - dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      litellm:
        condition: service_healthy
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles:
      - full

  # MySQL Database Service (Production)
  mysql:
    image: ${DASHBOARD_MYSQL_IMAGE:?set DASHBOARD_MYSQL_IMAGE to an immutable image digest}
    init: true
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-vllm_dashboard}
      - MYSQL_USER=${MYSQL_USER:-dashboard}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      # Persistent MySQL data - survives container restarts
      - mysql_data:/var/lib/mysql
      # Binlog bind mount（Phase 0：宿主机可直接访问，用于归档和 PITR）
      - /data/mysql/binlog:/var/log/mysql
      # Optional: custom MySQL configuration
      - ${DASHBOARD_MYSQL_CONFIG_FILE:-../../config-templates/mysql.cnf}:/etc/mysql/conf.d/custom.cnf:ro
      # Schema creation is explicit and runs through operations/production/migrate.sh.
    # MySQL should NOT be exposed to public - only accessible by backend service
    # If you need external access for maintenance, use SSH tunneling instead
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"
    networks:
      - dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Resource limits for MySQL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles:
      - full

  # Frontend Web Service
  frontend:
    image: ${DASHBOARD_FRONTEND_IMAGE:?set DASHBOARD_FRONTEND_IMAGE to a CI-published immutable image}
    init: true
    environment:
      - VITE_API_BASE_URL=/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource limits for frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    profiles:
      - full

  # ── Scheduler（Phase A 拆分后独立运行）──
  scheduler:
    image: ${DASHBOARD_BACKEND_IMAGE:?set DASHBOARD_BACKEND_IMAGE to a CI-published immutable image}
    init: true
    env_file:
      - ${DASHBOARD_RUNTIME_ENV_FILE:-../../../.env.production}
    environment:
      - DATABASE_URL=mysql+aiomysql://${SCHEDULER_DB_USER:-scheduler_svc}:${SCHEDULER_DB_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vllm_dashboard}
      - DB_POOL_SIZE=${SCHEDULER_DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${SCHEDULER_DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${SCHEDULER_DB_POOL_TIMEOUT:-30}
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
    command: python -m scheduler
    volumes:
      - backend_data:/app/data          # 共享 backend 的 data 目录（git 缓存、model_fo_map.json）
      - backend_logs:/app/logs
    networks:
      - dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "scheduler.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    profiles:
      - full

  # ── Collector（Phase A 拆分后独立运行，可多实例）──
  collector:
    image: ${DASHBOARD_BACKEND_IMAGE:?set DASHBOARD_BACKEND_IMAGE to a CI-published immutable image}
    init: true
    env_file:
      - ${DASHBOARD_RUNTIME_ENV_FILE:-../../../.env.production}
    environment:
      - DATABASE_URL=mysql+aiomysql://${COLLECTOR_DB_USER:-collector_svc}:${COLLECTOR_DB_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vllm_dashboard}
      - DB_POOL_SIZE=${COLLECTOR_DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${COLLECTOR_DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${COLLECTOR_DB_POOL_TIMEOUT:-30}
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - NODE_ID=collector-prod-1
      - CAPABILITIES=python
    command: python -m collector
    volumes:
      - backend_data:/app/data
    networks:
      - dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "collector.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    profiles:
      - full

# Named Volumes - Data persists outside container lifecycle
volumes:
  # Backend cache and generated data (the database is stored in mysql_data)
  # Git repository cache is stored in /app/data/repos (subdirectory of backend_data)
  backend_data:
    name: ${DASHBOARD_BACKEND_VOLUME:-vllm_ascend_dashboard_backend_data}
    external: true

  # Backend application logs
  backend_logs:
    name: ${DASHBOARD_BACKEND_LOG_VOLUME:-vllm_ascend_dashboard_backend_logs}
    external: true

  # MySQL database data
  mysql_data:
    name: ${DASHBOARD_MYSQL_VOLUME:-vllm_ascend_dashboard_mysql_data}
    external: true

# Network Configuration
networks:
  dashboard-network:
    name: ${DASHBOARD_NETWORK_NAME:-vllm_ascend_dashboard_dashboard-network}
    driver: bridge
    # Optional: specify subnet
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16
